<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OnikaAnime</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1e;
            --bg-secondary: #1a1a2e;
            --bg-tertiary: #16213e;
            --accent: #e94560;
            --accent-hover: #ff6b85;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b0;
            --text-muted: #6b6b7b;
            --card-bg: #16213e;
            --card-hover: #1f2947;
            --success: #00d9a3;
            --warning: #ffd966;
            --border-radius: 12px;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.4);
            --shadow-lg: 0 12px 24px rgba(233, 69, 96, 0.3);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 80px;
        }

        /* Навигация */
        .nav-tabs {
            display: flex;
            background: var(--bg-secondary);
            padding: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-md);
            overflow-x: auto;
            scrollbar-width: none;
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            flex: 1;
            min-width: 100px;
            padding: 16px 20px;
            background: transparent;
            border: none;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            transition: var(--transition);
            text-align: center;
        }

        .nav-tab:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-tab.active {
            color: var(--accent);
        }

        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--accent-gradient);
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: scaleX(0);
            }
            to {
                transform: scaleX(1);
            }
        }

        /* Контент секций */
        .content-section {
            display: none;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .content-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Профиль */
        .profile-header {
            background: var(--accent-gradient);
            padding: 30px 20px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }
            to {
                transform: rotate(360deg);
            }
        }

        .profile-info {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .avatar-container {
            position: relative;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            transition: var(--transition);
        }

        .avatar-frame {
            position: absolute;
            top: -8px;
            left: -8px;
            right: -8px;
            bottom: -8px;
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
            transition: var(--transition);
        }

        .avatar-frame.active {
            opacity: 1;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 1;
            }
            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .profile-details {
            flex: 1;
        }

        .profile-name {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-badge {
            font-size: 20px;
        }

        .profile-level {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 12px;
        }

        .xp-bar-container {
            background: rgba(0, 0, 0, 0.3);
            height: 8px;
            border-radius: 100px;
            overflow: hidden;
            position: relative;
        }

        .xp-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--warning));
            border-radius: 100px;
            transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .xp-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%);
            }
            100% {
                transform: translateX(100%);
            }
        }

        .xp-text {
            font-size: 12px;
            margin-top: 4px;
            opacity: 0.8;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--border-radius);
            text-align: center;
            transition: var(--transition);
        }

        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Поиск и фильтры */
        .search-filter-section {
            margin-bottom: 20px;
        }

        .search-bar {
            position: relative;
            margin-bottom: 15px;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 16px;
            transition: var(--transition);
        }

        .search-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(233, 69, 96, 0.1);
        }

        .filters-container {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-select {
            flex: 1;
            min-width: 120px;
            padding: 10px 15px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .filter-select:hover {
            border-color: var(--accent);
        }

        .filter-select:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Карточки аниме */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 20px;
        }

        @media (max-width: 768px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
                gap: 15px;
            }
        }

        .anime-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
        }

        .anime-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-lg);
        }

        .anime-poster {
            width: 100%;
            aspect-ratio: 2/3;
            object-fit: cover;
            display: block;
        }

        .anime-card-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.7) 50%, transparent 100%);
            opacity: 0;
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
        }

        .anime-card:hover .anime-card-overlay {
            opacity: 1;
        }

        .anime-card-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .anime-card-info {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .anime-card-rating {
            display: inline-block;
            background: var(--accent);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .watch-btn {
            background: var(--accent-gradient);
            border: none;
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .watch-btn:hover {
            transform: scale(1.05);
        }

        /* Плеер */
        .player-container {
            background: var(--bg-secondary);
            border-radius: var(--border-radius);
            overflow: hidden;
            margin-bottom: 20px;
        }

        .video-wrapper {
            position: relative;
            padding-top: 56.25%;
            background: #000;
        }

        #animePlayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .player-info {
            padding: 20px;
        }

        .player-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .episode-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .episode-selector select {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        .episode-selector select:hover {
            border-color: var(--accent);
        }

        .episode-controls {
            display: flex;
            gap: 10px;
        }

        .episode-btn {
            flex: 1;
            padding: 12px;
            background: var(--card-bg);
            border: none;
            border-radius: var(--border-radius);
            color: var(--text-primary);
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .episode-btn:hover:not(:disabled) {
            background: var(--accent);
        }

        .episode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Магазин */
        .shop-categories {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .shop-categories::-webkit-scrollbar {
            display: none;
        }

        .category-btn {
            padding: 10px 20px;
            background: var(--card-bg);
            border: 2px solid transparent;
            border-radius: 100px;
            color: var(--text-secondary);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--transition);
        }

        .category-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .shop-item {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 15px;
            text-align: center;
            transition: var(--transition);
            position: relative;
            cursor: pointer;
        }

        .shop-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .shop-item.owned {
            border: 2px solid var(--success);
        }

        .owned-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--success);
            color: white;
            font-size: 10px;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .item-preview {
            width: 80px;
            height: 80px;
            margin: 0 auto 12px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            position: relative;
        }

        .item-frame {
            position: absolute;
            inset: -6px;
            border-radius: 50%;
            padding: 6px;
        }

        .item-name {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .item-price {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            color: var(--warning);
            font-weight: 700;
        }

        .buy-btn {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .buy-btn:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .buy-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Друзья */
        .friends-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .friend-card {
            background: var(--card-bg);
            padding: 15px;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            gap: 15px;
            transition: var(--transition);
        }

        .friend-card:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-md);
        }

        .friend-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .friend-info {
            flex: 1;
        }

        .friend-name {
            font-weight: 600;
            margin-bottom: 4px;
        }

        .friend-status {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Загрузка */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% {
                content: '.';
            }
            40% {
                content: '..';
            }
            60%, 100% {
                content: '...';
            }
        }

        /* Мобильная навигация */
        @media (max-width: 768px) {
            .app-container {
                padding-bottom: 70px;
            }

            .nav-tabs {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                top: auto;
                padding: 8px 0;
                border-top: 1px solid rgba(255, 255, 255, 0.1);
            }

            .nav-tab {
                padding: 8px 12px;
                font-size: 11px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
            }

            .nav-tab::before {
                content: attr(data-icon);
                font-size: 20px;
            }

            .nav-tab.active::after {
                top: 0;
                bottom: auto;
            }

            .content-section {
                padding: 15px;
            }
        }

        /* Утилиты */
        .text-center {
            text-align: center;
        }

        .mt-20 {
            margin-top: 20px;
        }

        .mb-20 {
            margin-bottom: 20px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Навигация -->
        <div class="nav-tabs">
            <button class="nav-tab active" data-tab="profile" data-icon="👤">Профиль</button>
            <button class="nav-tab" data-tab="catalog" data-icon="📺">Каталог</button>
            <button class="nav-tab" data-tab="player" data-icon="▶️">Плеер</button>
            <button class="nav-tab" data-tab="shop" data-icon="🛒">Магазин</button>
            <button class="nav-tab" data-tab="friends" data-icon="👥">Друзья</button>
        </div>

        <!-- Профиль -->
        <div class="content-section active" id="profile-section">
            <div class="profile-header">
                <div class="profile-info">
                    <div class="avatar-container">
                        <img class="profile-avatar" id="profileAvatar" src="https://via.placeholder.com/80" alt="Avatar">
                        <div class="avatar-frame" id="avatarFrame"></div>
                    </div>
                    <div class="profile-details">
                        <div class="profile-name">
                            <span id="profileName">Аноним</span>
                            <span class="profile-badge" id="profileBadge"></span>
                        </div>
                        <div class="profile-level">Уровень <span id="userLevel">1</span></div>
                        <div class="xp-bar-container">
                            <div class="xp-bar" id="xpBar" style="width: 0%"></div>
                        </div>
                        <div class="xp-text"><span id="currentXP">0</span> / <span id="nextLevelXP">100</span> XP</div>
                    </div>
                </div>
            </div>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalWatched">0</div>
                    <div class="stat-label">Просмотрено</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">💰 <span id="userCoins">0</span></div>
                    <div class="stat-label">Монеты</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="achievementsCount">0</div>
                    <div class="stat-label">Достижения</div>
                </div>
            </div>
        </div>

        <!-- Каталог -->
        <div class="content-section" id="catalog-section">
            <div class="search-filter-section">
                <div class="search-bar">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Поиск аниме...">
                </div>
                <div class="filters-container">
                    <select id="genreFilter" class="filter-select">
                        <option value="">Все жанры</option>
                        <option value="1">Экшен</option>
                        <option value="8">Драма</option>
                        <option value="4">Комедия</option>
                        <option value="22">Романтика</option>
                        <option value="10">Фэнтези</option>
                        <option value="24">Sci-Fi</option>
                    </select>
                    <select id="sortFilter" class="filter-select">
                        <option value="popularity">По популярности</option>
                        <option value="ranked">По рейтингу</option>
                        <option value="aired_on">По дате выхода</option>
                        <option value="name">По алфавиту</option>
                    </select>
                    <select id="statusFilter" class="filter-select">
                        <option value="">Все статусы</option>
                        <option value="ongoing">Онгоинг</option>
                        <option value="released">Завершён</option>
                        <option value="anons">Анонс</option>
                    </select>
                </div>
            </div>
            <div id="animeGrid" class="anime-grid loading">Загрузка аниме</div>
        </div>

        <!-- Плеер -->
        <div class="content-section" id="player-section">
            <div id="playerContent" class="text-center" style="padding: 40px; color: var(--text-secondary);">
                Выберите аниме из каталога для просмотра
            </div>
        </div>

        <!-- Магазин -->
        <div class="content-section" id="shop-section">
            <div class="shop-categories">
                <button class="category-btn active" data-category="frames">🖼️ Рамки</button>
                <button class="category-btn" data-category="badges">🏅 Бейджи</button>
            </div>
            <div id="shopGrid" class="shop-grid"></div>
        </div>

        <!-- Друзья -->
        <div class="content-section" id="friends-section">
            <div id="friendsList" class="friends-list"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
