<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnikaAnime</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a2e;
            --bg-secondary: #16213e;
            --bg-card: #0f3460;
            --accent: #e94560;
            --accent-gradient: linear-gradient(135deg, #e94560 0%, #ff6b9d 100%);
            --text-primary: #ffffff;
            --text-secondary: #a0a0b8;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% { background-position: -1000px 0; }
            100% { background-position: 1000px 0; }
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Header */
        .header {
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            animation: slideUp 0.5s ease;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-bar {
            flex: 1;
            max-width: 400px;
            margin: 0 20px;
            position: relative;
        }

        .search-bar input {
            width: 100%;
            padding: 10px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--accent);
            box-shadow: 0 0 15px rgba(233, 69, 96, 0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-avatar {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .user-avatar:hover {
            transform: scale(1.1);
        }

        /* Main Content */
        .page {
            display: none;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease;
        }

        .page.active {
            display: block;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            margin: 20px 0 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 25px;
            background: var(--accent-gradient);
            border-radius: 2px;
        }

        /* Anime Grid */
        .anime-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .anime-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.05);
            animation: slideUp 0.5s ease;
        }

        .anime-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.3);
            border-color: var(--accent);
        }

        .anime-poster {
            position: relative;
            padding-top: 140%;
            overflow: hidden;
            background: linear-gradient(135deg, #16213e 0%, #0f3460 100%);
        }

        .anime-poster img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .anime-card:hover .anime-poster img {
            transform: scale(1.1);
        }

        .anime-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: rgba(0, 0, 0, 0.8);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            backdrop-filter: blur(5px);
        }

        .anime-info {
            padding: 10px;
        }

        .anime-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .anime-meta {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, 
                #16213e 0%, 
                #1a2540 50%, 
                #16213e 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        .skeleton-card {
            background: var(--bg-secondary);
            border-radius: 12px;
            overflow: hidden;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .skeleton-poster {
            padding-top: 140%;
            background: linear-gradient(90deg, 
                #16213e 0%, 
                #1a2540 50%, 
                #16213e 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        .skeleton-info {
            padding: 10px;
        }

        .skeleton-title {
            height: 16px;
            margin-bottom: 8px;
            border-radius: 4px;
            background: linear-gradient(90deg, 
                #0f3460 0%, 
                #16213e 50%, 
                #0f3460 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        .skeleton-line {
            height: 12px;
            border-radius: 4px;
            background: linear-gradient(90deg, 
                #0f3460 0%, 
                #16213e 50%, 
                #0f3460 100%
            );
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
        }

        /* Filters */
        .filters {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .filter-btn {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            font-size: 14px;
            font-weight: 500;
        }

        .filter-btn:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            border-color: var(--accent);
        }

        /* Bottom Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(10px);
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 100;
        }

        .nav-items {
            display: flex;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            padding: 8px 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            border-radius: 10px;
            position: relative;
        }

        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 3px;
            background: var(--accent-gradient);
            border-radius: 0 0 3px 3px;
        }

        .nav-item:active {
            transform: scale(0.95);
        }

        .nav-icon {
            font-size: 22px;
            transition: transform 0.3s ease;
        }

        .nav-item.active .nav-icon {
            transform: scale(1.1);
        }

        .nav-label {
            font-size: 11px;
            color: var(--text-secondary);
            transition: color 0.3s ease;
        }

        .nav-item.active .nav-label {
            color: var(--text-primary);
        }

        /* Profile */
        .profile-header {
            background: var(--bg-secondary);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: var(--accent-gradient);
            opacity: 0.3;
        }

        .profile-content {
            position: relative;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .profile-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-gradient);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            border: 3px solid var(--bg-primary);
            box-shadow: 0 5px 20px rgba(233, 69, 96, 0.3);
        }

        .profile-stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 700;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 200;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-secondary);
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 25px;
            position: relative;
            animation: slideUp 0.3s ease;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-close:hover {
            background: var(--accent);
            transform: rotate(90deg);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--accent-gradient);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .anime-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
                gap: 10px;
            }

            .search-bar {
                max-width: none;
                margin: 0 10px;
            }
        }

        .page-content {
            padding-bottom: 80px;
        }

        /* Loading Spinner */
        .loading {
            display: flex;
            justify-content: center;
            padding: 40px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-content">
            <div class="logo">🎬 OnikaAnime</div>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Поиск аниме...">
            </div>
            <div class="user-info">
                <div class="user-avatar" id="userAvatar">U</div>
            </div>
        </div>
    </div>

    <!-- Home Page -->
    <div id="homePage" class="page active">
        <div class="page-content">
            <h2 class="section-title">🔥 Популярное</h2>
            <div class="anime-grid" id="trendingGrid"></div>

            <h2 class="section-title">✨ Рекомендации</h2>
            <div class="anime-grid" id="recommendationsGrid"></div>
        </div>
    </div>

    <!-- Catalog Page -->
    <div id="catalogPage" class="page">
        <div class="page-content">
            <h2 class="section-title">📚 Каталог</h2>
            <div class="filters" id="catalogFilters">
                <button class="filter-btn active" data-filter="all">Все</button>
                <button class="filter-btn" data-filter="ongoing">Онгоинги</button>
                <button class="filter-btn" data-filter="anons">Анонсы</button>
                <button class="filter-btn" data-filter="movie">Фильмы</button>
                <button class="filter-btn" data-filter="ova">OVA</button>
            </div>
            <div class="anime-grid" id="catalogGrid"></div>
            <div id="loadingMore" class="loading" style="display: none;">
                <div class="spinner"></div>
            </div>
        </div>
    </div>

    <!-- My List Page -->
    <div id="myListPage" class="page">
        <div class="page-content">
            <h2 class="section-title">📝 Мой список</h2>
            <div class="filters" id="myListFilters">
                <button class="filter-btn active" data-status="watching">Смотрю</button>
                <button class="filter-btn" data-status="completed">Просмотрено</button>
                <button class="filter-btn" data-status="planned">В планах</button>
                <button class="filter-btn" data-status="on_hold">Отложено</button>
                <button class="filter-btn" data-status="dropped">Брошено</button>
            </div>
            <div class="anime-grid" id="myListGrid"></div>
        </div>
    </div>

    <!-- Friends Page -->
    <div id="friendsPage" class="page">
        <div class="page-content">
            <h2 class="section-title">👥 Друзья</h2>
            <div class="anime-grid" id="friendsGrid"></div>
        </div>
    </div>

    <!-- Profile Page -->
    <div id="profilePage" class="page">
        <div class="page-content">
            <div class="profile-header">
                <div class="profile-content">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <div>
                        <h2 id="profileName" style="font-size: 22px; margin-bottom: 5px;">Пользователь</h2>
                        <div style="color: var(--text-secondary); font-size: 14px;">Уровень <span id="userLevel">1</span></div>
                    </div>
                </div>
                <div class="profile-stats">
                    <div class="stat-item">
                        <div class="stat-value" id="animeWatched">0</div>
                        <div class="stat-label">Просмотрено</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="episodesWatched">0</div>
                        <div class="stat-label">Эпизодов</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="userCoins">0</div>
                        <div class="stat-label">Монет</div>
                    </div>
                </div>
            </div>

            <h2 class="section-title">🏆 Достижения</h2>
            <div id="achievementsGrid"></div>

            <h2 class="section-title">🛍️ Магазин</h2>
            <div id="shopGrid"></div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-items">
            <div class="nav-item active" data-page="homePage">
                <div class="nav-icon">🏠</div>
                <div class="nav-label">Главная</div>
            </div>
            <div class="nav-item" data-page="catalogPage">
                <div class="nav-icon">📚</div>
                <div class="nav-label">Каталог</div>
            </div>
            <div class="nav-item" data-page="myListPage">
                <div class="nav-icon">📝</div>
                <div class="nav-label">Моё</div>
            </div>
            <div class="nav-item" data-page="friendsPage">
                <div class="nav-icon">👥</div>
                <div class="nav-label">Друзья</div>
            </div>
            <div class="nav-item" data-page="profilePage">
                <div class="nav-icon">👤</div>
                <div class="nav-label">Профиль</div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal" id="animeModal">
        <div class="modal-content" id="animeModalContent">
            <button class="modal-close" onclick="closeModal()">×</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
