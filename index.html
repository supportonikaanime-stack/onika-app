<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OnikaAnime</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= ГЛАВНАЯ СТРАНИЦА ================= -->
    <div id="screen-home" class="screen active">
        
        <!-- Шапка -->
        <header class="top-header">
            <div class="logo">Onika<span>Anime</span></div>
            <div class="header-icons">
                <button class="icon-btn">🔔</button>
                <button class="icon-btn" onclick="switchTab('profile')">👤</button>
            </div>
        </header>

        <!-- Баннер (Hero) -->
        <section class="hero-section">
            <div class="hero-bg" id="heroBg"></div>
            <div class="hero-gradient"></div>
            <div class="hero-content">
                <div class="hero-badges" id="heroBadges">
                    <span class="badge">⭐ 8.7</span>
                    <span class="badge">ТВ Сериал</span>
                    <span class="badge">2026</span>
                </div>
                <h1 class="hero-title" id="heroTitle">Загрузка...</h1>
                <p class="hero-desc" id="heroDesc">Пожалуйста, подождите...</p>
                
                <div class="hero-actions">
                    <button class="btn-primary" onclick="playHero()">▶ Смотреть</button>
                    <button class="btn-secondary">👁 Подробнее</button>
                </div>
            </div>
        </section>

        <!-- Секция: Тренды -->
        <section class="content-section">
            <div class="section-header">
                <h2>🔥 Сейчас в тренде</h2>
                <a href="#">Все →</a>
            </div>
            <div class="horizontal-scroll" id="trending-list">
                <!-- Сюда JS вставит карточки -->
            </div>
        </section>

        <!-- Секция: Каталог -->
        <section class="content-section">
            <div class="section-header">
                <h2>📚 Каталог аниме</h2>
            </div>
            <div class="grid-catalog" id="catalog-list">
                <!-- Сюда JS вставит карточки -->
            </div>
        </section>

    </div>

    <!-- ================= СТРАНИЦА ПРОФИЛЯ ================= -->
    <div id="screen-profile" class="screen">
        <header class="top-header">
            <div class="logo">Профиль</div>
        </header>
        
        <div class="profile-container">
            <div class="profile-card">
                <div class="avatar">U</div>
                <div class="user-info">
                    <h2>Пользователь</h2>
                    <p>Уровень 1</p>
                </div>
            </div>

            <div class="menu-list">
                <div class="menu-item">📺 Мой список</div>
                <div class="menu-item">🏆 Достижения</div>
                <div class="menu-item">⚙️ Настройки</div>
            </div>
        </div>
    </div>

    <!-- ================= НИЖНЕЕ МЕНЮ ================= -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Главная</span>
        </div>
        <div class="nav-item" onclick="switchTab('catalog', this)">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">Каталог</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <span class="nav-icon">👤</span>
            <span class="nav-text">Профиль</span>
        </div>
    </nav>

    <!-- ПОДКЛЮЧАЕМ ЛОГИКУ -->
    <script src="app.js"></script>
</body>
</html>
