<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OnikaAnime</title>
    <!-- Подключаем Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- СТИЛИ ВСТРОЕНЫ ПРЯМО СЮДА (чтобы Telegram их не кешировал) -->
    <style>
        :root {
            --bg: #0a0a0f; --card: #1a1a20; --primary: #5b5bff; --text: #fff; --muted: #888; --nav-h: 65px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding-bottom: calc(var(--nav-h) + 20px); overflow-x: hidden; }
        
        /* Экраны */
        .screen { display: none; }
        .screen.active { display: block; animation: fade 0.3s ease; }
        @keyframes fade { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Баннер */
        .hero-section { position: relative; height: 85vh; min-height: 500px; overflow: hidden; }
        .hero-slide { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; visibility: hidden; transition: 0.6s; display: flex; align-items: flex-end; }
        .hero-slide.active { opacity: 1; visibility: visible; z-index: 2; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center top; z-index: 1; transform: scale(1); transition: transform 8s linear; }
        .hero-slide.active .hero-bg { transform: scale(1.15); }
        .hero-gradient { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(10,10,15,0.8) 0%, transparent 20%, transparent 50%, var(--bg) 95%), radial-gradient(circle at center, transparent 30%, rgba(10,10,15,0.6) 100%); z-index: 2; }
        .hero-content { position: relative; z-index: 3; padding: 20px; width: 100%; padding-bottom: 40px; transform: translateY(20px); opacity: 0; transition: 0.6s; }
        .hero-slide.active .hero-content { transform: translateY(0); opacity: 1; transition-delay: 0.2s; }
        
        /* Бейджи */
        .hero-badges { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .badge { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; color: #fff; border: 1px solid rgba(255,255,255,0.1); }
        .badge.star { color: #ffd700; background: rgba(0,0,0,0.4); border-color: rgba(255,215,0,0.2); }
        
        /* Заголовок и кнопки */
        .hero-title { font-size: 34px; font-weight: 800; line-height: 1.1; margin-bottom: 15px; color: #fff; text-shadow: 0 4px 20px rgba(0,0,0,0.8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .hero-actions { display: flex; gap: 12px; align-items: center; }
        .btn-primary { flex: 1; background: var(--primary); color: #fff; border: none; padding: 16px; border-radius: 14px; font-size: 16px; font-weight: 700; display: flex; justify-content: center; align-items: center; gap: 8px; box-shadow: 0 8px 25px rgba(91,91,255,0.4); cursor: pointer; }
        .btn-primary:active { transform: scale(0.96); }
        .btn-icon-heart { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); color: #fff; width: 56px; height: 56px; border-radius: 14px; font-size: 22px; display: flex; justify-content: center; align-items: center; }
        .btn-icon-heart.faved { background: rgba(255,45,120,0.2); border-color: rgba(255,45,120,0.5); }
        
        /* Точки */
        .hero-dots { position: absolute; bottom: 20px; right: 20px; display: flex; gap: 6px; z-index: 10; background: rgba(0,0,0,0.3); padding: 6px 10px; border-radius: 20px; backdrop-filter: blur(5px); }
        .hero-dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.3); transition: 0.3s; }
        .hero-dot.active { width: 18px; border-radius: 4px; background: var(--primary); box-shadow: 0 0 10px rgba(91,91,255,0.5); }

        /* Секции */
        .content-section { padding: 20px 0; }
        .section-header { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; margin-bottom: 15px; }
        .section-header h2 { font-size: 20px; font-weight: 700; }
        .horizontal-scroll { display: flex; gap: 12px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; }
        .horizontal-scroll::-webkit-scrollbar { display: none; }
        .grid-catalog { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 0 20px; }

        /* Карточки */
        .card { background: var(--card); border-radius: 12px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .card:active { transform: scale(0.96); }
        .card-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; display: block; }
        .card-title { position: absolute; bottom: 0; left: 0; width: 100%; padding: 30px 10px 10px 10px; font-size: 13px; font-weight: 700; color: #fff; background: linear-gradient(to top, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 60%, transparent 100%); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; box-sizing: border-box; z-index: 2; }
        .horizontal-scroll .card { min-width: 130px; width: 130px; height: 195px; }
        .horizontal-scroll .card-img { height: 100%; }

        /* Продолжить просмотр */
        .continue-card { min-width: 260px; width: 260px; height: 140px; background: var(--card); border-radius: 12px; overflow: hidden; position: relative; }
        .continue-card-img { width: 100%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; z-index: 1; }
        .continue-card-info { position: absolute; top: 0; left: 0; width: 100%; height: 100%; padding: 15px; background: linear-gradient(to top, rgba(10,10,15,0.95) 0%, rgba(10,10,15,0.4) 60%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; z-index: 2; }
        .continue-card-title { font-size: 15px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .continue-card-ep { font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 6px; }
        .continue-progress-bar { width: 100%; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; }
        .continue-progress-fill { height: 100%; background: var(--primary); border-radius: 2px; box-shadow: 0 0 8px var(--primary); }

        /* Кнопка ТГ */
        .tg-banner-section { padding: 10px 20px 20px; }
        .tg-banner { display: flex; align-items: center; background: linear-gradient(135deg, rgba(0,136,204,0.15), rgba(0,136,204,0.05)); border: 1px solid rgba(0,136,204,0.3); padding: 16px; border-radius: 16px; text-decoration: none !important; color: white !important; }
        .tg-icon { width: 45px; height: 45px; background: #0088cc; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; margin-right: 15px; }
        .tg-text h3 { font-size: 16px; font-weight: 700; margin-bottom: 2px; color: white !important; }
        .tg-text p { font-size: 12px; color: rgba(255,255,255,0.6) !important; }

        /* Профиль */
        .profile-container { padding: 30px 20px 20px; }
        .profile-card { display: flex; align-items: center; gap: 15px; background: var(--card); padding: 20px; border-radius: 16px; margin-bottom: 20px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), #b44aff); display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; overflow: hidden; }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-info h2 { font-size: 18px; margin-bottom: 4px; }
        .user-info p { color: var(--muted); font-size: 13px; }

        /* Нижнее меню */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: var(--nav-h); background: rgba(10,10,15,0.95); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-around; align-items: center; z-index: 9999; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); }
        .nav-item.active { color: var(--primary); }
        .nav-icon { font-size: 22px; margin-bottom: 4px; }
        .nav-text { font-size: 11px; font-weight: 500; }
    </style>
</head>
<body>

    <!-- ЭКРАН: ГЛАВНАЯ -->
    <div id="screen-home" class="screen active">
        <section class="hero-section" id="heroSection">
            <div class="hero-slider" id="heroSlider"></div>
            <div class="hero-dots" id="heroDots"></div>
        </section>

        <section class="content-section">
            <div class="section-header"><h2>▶ Продолжить просмотр</h2></div>
            <div class="horizontal-scroll" id="continue-list"></div>
        </section>

        <section class="content-section">
            <div class="section-header"><h2>🔥 Популярное сейчас</h2></div>
            <div class="horizontal-scroll" id="popular-list"></div>
        </section>

        <section class="tg-banner-section">
            <a href="https://t.me/onikaanime" target="_blank" class="tg-banner">
                <div class="tg-icon">✈️</div>
                <div class="tg-text">
                    <h3>Наш Telegram-канал</h3>
                    <p>Новости, розыгрыши и анонсы</p>
                </div>
            </a>
        </section>

        <section class="content-section">
            <div class="section-header"><h2>✨ Рекомендации для вас</h2></div>
            <div class="grid-catalog" id="recommended-list"></div>
        </section>
    </div>

    <!-- ЭКРАН: ПРОФИЛЬ -->
    <div id="screen-profile" class="screen">
        <div class="profile-container">
            <!-- Карточка профиля (Заполнится автоматически из Telegram) -->
            <div class="profile-card">
                <div class="avatar" id="tg-avatar">?</div>
                <div class="user-info">
                    <h2 id="tg-name">Гость</h2>
                    <p id="tg-username">@username</p>
                </div>
            </div>
            
            <div style="background: #1a1a20; border-radius: 16px; padding: 15px; text-align: center; color: #888; font-size: 13px;">
                Вы авторизованы через Telegram
            </div>
        </div>
    </div>

    <!-- НИЖНЕЕ МЕНЮ -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🏠</span><span class="nav-text">Главная</span>
        </div>
        <div class="nav-item" onclick="switchTab('catalog', this)">
            <span class="nav-icon">🔍</span><span class="nav-text">Каталог</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <span class="nav-icon">👤</span><span class="nav-text">Профиль</span>
        </div>
    </nav>

    <!-- ЛОГИКА -->
    <script src="app.js?v=4"></script>
</body>
</html>
