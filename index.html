<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>OnikaAnime</title>
    <!-- Подключаем скрипт Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем наши стили -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ================= ГЛАВНАЯ СТРАНИЦА ================= -->
    <div id="screen-home" class="screen active">
        
        <!-- 1) Кинематографичный Баннер -->
        <section class="hero-section" id="heroSection">
            <div class="hero-slider" id="heroSlider">
                <!-- Слайды генерируются в app.js -->
            </div>
            <div class="hero-dots" id="heroDots"></div>
        </section>

        <!-- 2) Продолжить просмотр -->
        <section class="content-section" id="continue-section">
            <div class="section-header">
                <h2>▶ Продолжить просмотр</h2>
            </div>
            <div class="horizontal-scroll" id="continue-list">
                <!-- Сюда JS вставит карточки -->
            </div>
        </section>

        <!-- 3) Популярное сейчас -->
        <section class="content-section">
            <div class="section-header">
                <h2>🔥 Популярное сейчас</h2>
                <a href="#">Все →</a>
            </div>
            <div class="horizontal-scroll" id="popular-list">
                <!-- Сюда JS вставит карточки -->
            </div>
        </section>

        <!-- 4) Кнопка Telegram-канала -->
        <section class="tg-banner-section">
            <a href="https://t.me/onikaanime" target="_blank" class="tg-banner">
                <div class="tg-icon">✈️</div>
                <div class="tg-text">
                    <h3>Наш Telegram-канал</h3>
                    <p>Новости, розыгрыши и анонсы</p>
                </div>
                <div class="tg-arrow">→</div>
            </a>
        </section>

        <!-- 5) Рекомендации для вас -->
        <section class="content-section">
            <div class="section-header">
                <h2>✨ Рекомендации для вас</h2>
            </div>
            <div class="grid-catalog" id="recommended-list">
                <!-- Сюда JS вставит карточки -->
            </div>
        </section>

    </div>

    <!-- ================= СТРАНИЦА ПРОФИЛЯ ================= -->
    <div id="screen-profile" class="screen">
        <header class="top-header" style="position: relative; background: transparent;">
            <div class="logo">Профиль</div>
        </header>
        
        <div class="profile-container" style="padding-top: 20px;">
            <div class="profile-card">
                <div class="avatar" id="profileAvatar">U</div>
                <div class="user-info">
                    <h2 id="profileName">Гость</h2>
                    <p>Уровень 1</p>
                </div>
            </div>

            <div class="menu-list">
                <div class="menu-item">📺 Мой список</div>
                <div class="menu-item">🏆 Достижения</div>
                <div class="menu-item">⚙️ Настройки</div>
            </div>
        </div>
    </div>

    <!-- ================= НИЖНЕЕ МЕНЮ ================= -->
    <nav class="bottom-nav">
        <div class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">Главная</span>
        </div>
        <div class="nav-item" onclick="switchTab('catalog', this)">
            <span class="nav-icon">🔍</span>
            <span class="nav-text">Каталог</span>
        </div>
        <div class="nav-item" onclick="switchTab('profile', this)">
            <span class="nav-icon">👤</span>
            <span class="nav-text">Профиль</span>
        </div>
    </nav>

    <!-- ПОДКЛЮЧАЕМ ЛОГИКУ -->
    <script src="app.js"></script>
</body>
</html>
